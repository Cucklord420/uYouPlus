name: Debian package extraction regressions

on:
  pull_request:
    paths:
      - Makefile
      - rust/build-inputs/Cargo.toml
      - rust/build-inputs/src/bin/uyou_deb.rs
      - rust/build-inputs/tests/uyou_deb.rs
      - rust/build-inputs/tests/fixtures/fake_curl.rs
      - .github/workflows/verify-debian-ar.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-debian:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Synthetic Debian ar extraction and Rust Makefile integration
        run: cargo test --manifest-path rust/build-inputs/Cargo.toml --bin uyou-deb --test uyou_deb
