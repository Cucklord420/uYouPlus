name: Debian package extraction regressions

on:
  pull_request:
    paths:
      - Makefile
      - tests/test_debian_ar_extraction.py
      - .github/workflows/verify-debian-ar.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-debian:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Synthetic Debian ar extraction and Makefile ordering
        run: python3 -m unittest discover -s tests -p 'test_debian_ar_extraction.py' -v
